<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function() {
        const suppress = [
          'google.accounts.id.initialize',
          'web-share',
          'postMessage',
          'DOMWindow',
          'youtube.com/youtubei/v1/log_event',
          'www-widgetapi'
        ];
        
        const shouldSuppress = (args) => {
          try {
            const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
            return suppress.some(keyword => msg.includes(keyword));
          } catch (e) {
            return false;
          }
        };

        const originalWarn = console.warn;
        const originalError = console.error;

        console.warn = function(...args) {
          if (shouldSuppress(args)) return;
          originalWarn.apply(console, args);
        };

        console.error = function(...args) {
          if (shouldSuppress(args)) return;
          originalError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melo — Obsidian Cathedral</title>
    <meta name="description" content="Melo - A premium, high-fidelity music player with real-time synchronized LRC lyrics powered by AI and search controls." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Google Identity Services script for Google Auth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="min-h-screen flex flex-col font-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
